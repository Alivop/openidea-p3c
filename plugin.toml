id = "alivop.p3c"
name = "Java Coding Guidelines"
version = "0.1.5"
description = "Checks Java files against the Alibaba Java Development Manual (P3C) while you type, with quick fixes and a project-wide scan; diagnostics appear automatically once installed or enabled. Pure WebAssembly (no PMD/JDK).\nSettings: Settings → Plugins → Java Coding Guidelines (master switch + per-group switches).\nScan: Tools → Java Coding Guidelines: Scan Project.\n中文：边写边按《阿里巴巴 Java 开发手册》（P3C）检查 Java 文件，提供快速修复与全项目扫描；安装或启用后自动出诊断。纯 WebAssembly（无需 PMD/JDK）。\n设置路径：设置 → 插件 → Java Coding Guidelines（总开关 + 按组开关）。\n扫描路径：工具 → Java Coding Guidelines: Scan Project。"
authors = ["Alivop"]
license = "Apache-2.0"
change-notes = "0.1.5 — close two boundary gaps in the same quick-fix safeguards.\n- Move-brackets: the shared-declaration scan now only treats a same-level ; as the declaration boundary, so a ; inside an anonymous class or block lambda in the initializer (Object a[] = { new Object() { int x; } }, b; or Runnable a[] = { () -> { ... } }, b;) no longer hides the later sibling. These shared declarations are omitted instead of moving [] onto the common type and changing the sibling's type.\n- Add-braces: a labelled body (label: while ... / label: if ...) is now omitted too, so the label prefix no longer bypasses the control-flow guard and truncates the embedded statement, re-binding its dangling else.\n- Added anonymous-class/block-lambda and labelled-body regressions; verified with javac (the buggy rewrites fail to compile) and a bounded execution fixture (the offered rewrites keep the original traces).\n\n中文：0.1.5 补齐同一组快速修复防护的两个边界缺口。\n- 移动中括号：共享声明扫描现在只把同层的 ; 当作声明结尾，初始化器里匿名类/块 lambda 内部的 ;（Object a[] = { new Object() { int x; } }, b; 或 Runnable a[] = { () -> { ... } }, b;）不再遮住后面的兄弟声明符。这类共享声明整体跳过，不再把 [] 搬到公共类型上而改变兄弟的类型。\n- 补大括号：带标签的 body（label: while … / label: if …）也整体跳过，标签前缀不再绕过控制流守卫、截断内嵌语句并抢走悬垂 else。\n- 新增匿名类/块 lambda 与带标签 body 回归测试；已用 javac（错误改写无法编译）与有界运行轨迹夹具（提供的改写保持原轨迹）核验。"
categories = ["linters"]
engines.openidea = "^1.6"
wasm = "dist/plugin.wasm"
activation = ["on-startup-finished", "on-schedule:60", "on-event:document-changed", "on-event:file-opened", "on-event:file-saved", "on-event:editor-focused", "on-command:*"]

[capabilities]
required = ["project.read", "events"]
optional = ["editor.read"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["java"]

[[contributes.commands]]
id = "scan"
title = "Java Coding Guidelines: Scan Project"
category = "Java Coding Guidelines"

[[contributes.menus]]
menu = "tools"
command = "scan"

[contributes.settings]
title = "Java Coding Guidelines"
schema = "settings.schema.json"