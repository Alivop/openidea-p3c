id = "alivop.p3c"
name = "Java Coding Guidelines"
version = "0.1.4"
description = "Checks Java files against the Alibaba Java Development Manual (P3C) while you type, with quick fixes and a project-wide scan; diagnostics appear automatically once installed or enabled. Pure WebAssembly (no PMD/JDK).\nSettings: Settings → Plugins → Java Coding Guidelines (master switch + per-group switches).\nScan: Tools → Java Coding Guidelines: Scan Project.\n中文：边写边按《阿里巴巴 Java 开发手册》（P3C）检查 Java 文件，提供快速修复与全项目扫描；安装或启用后自动出诊断。纯 WebAssembly（无需 PMD/JDK）。\n设置路径：设置 → 插件 → Java Coding Guidelines（总开关 + 按组开关）。\n扫描路径：工具 → Java Coding Guidelines: Scan Project。"
authors = ["Alivop"]
license = "Apache-2.0"
change-notes = "0.1.4 — preserve types and control flow in two quick fixes.\n- Move-brackets: a shared declaration (int a[], b; or int a, b[];) is now left alone instead of moving [] onto the common type, which silently changed a sibling's dimensions (b = 1 then fails to compile) or produced illegal code (int a,[] b). Lone field/local/parameter declarations are still fixed, including generic types whose commas are type arguments, not declarator separators.\n- Add-braces: a body that is itself a control-flow statement (if/while/for/do/switch/try/synchronized) is now omitted, so wrapping no longer truncates an embedded statement at its first ; and re-binds a dangling else. Expression-statement bodies are still wrapped.\n- Added type-preservation and control-flow-preservation regressions; verified with javac (the buggy rewrites fail to compile) and a bounded execution fixture (the offered rewrites keep the original traces).\n\n中文：0.1.4 两个快速修复保类型、保控制流。\n- 移动中括号：共享声明（int a[], b; 或 int a, b[];）不再把 [] 搬到公共类型上——那会悄悄改变兄弟变量的维度（随后 b = 1 无法编译）或产出非法代码（int a,[] b）。单独的字段/局部变量/参数声明仍会修复，泛型实参里的逗号是类型参数而非声明符分隔符，也不受影响。\n- 补大括号：body 本身是控制流语句（if/while/for/do/switch/try/synchronized）时整体跳过，不再在第一个 ; 处截断内嵌语句、把悬垂 else 抢给外层。表达式语句 body 仍会补括号。\n- 新增保类型与保控制流回归测试；已用 javac（错误改写无法编译）与有界运行轨迹夹具（提供的改写保持原轨迹）核验。"
categories = ["linters"]
engines.openidea = "^1.6"
wasm = "dist/plugin.wasm"
activation = ["on-startup-finished", "on-schedule:60", "on-event:document-changed", "on-event:file-opened", "on-event:file-saved", "on-event:editor-focused", "on-command:*"]

[capabilities]
required = ["project.read", "events"]
optional = ["editor.read"]

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["java"]

[[contributes.commands]]
id = "scan"
title = "Java Coding Guidelines: Scan Project"
category = "Java Coding Guidelines"

[[contributes.menus]]
menu = "tools"
command = "scan"

[contributes.settings]
title = "Java Coding Guidelines"
schema = "settings.schema.json"